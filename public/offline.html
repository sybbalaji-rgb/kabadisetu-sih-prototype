<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#173d30" />
    <title>KabadiSetu — Offline</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #edf1e8; color: #17312a; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { width: min(100%, 440px); border: 1px solid #d6ded1; border-radius: 28px; background: #f9fbf7; padding: 32px; box-shadow: 0 18px 50px rgba(23, 61, 48, 0.12); text-align: center; }
      .icon { width: 64px; height: 64px; display: grid; place-items: center; margin: 0 auto 20px; border-radius: 20px; background: #173d30; color: #e9ff9d; font-size: 30px; }
      h1 { margin: 0; font-size: 28px; }
      p { margin: 12px 0 0; color: #617069; line-height: 1.6; }
      button { margin-top: 24px; border: 0; border-radius: 14px; background: #173d30; color: white; padding: 12px 20px; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <div class="icon">♻</div>
      <h1>KabadiSetu is offline</h1>
      <p>Open the app once while connected so the complete collector workspace can be saved on this device.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
